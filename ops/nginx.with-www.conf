server {
    listen 80;
    listen [::]:80;
    server_name aglegal.com.co www.aglegal.com.co aglegal.restaurar.co;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://aglegal.com.co$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aglegal.restaurar.co;

    ssl_certificate /etc/letsencrypt/live/aglegal.restaurar.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aglegal.restaurar.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    return 301 https://aglegal.com.co$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.aglegal.com.co;

    ssl_certificate /etc/letsencrypt/live/aglegal.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aglegal.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    return 301 https://aglegal.com.co$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aglegal.com.co;

    ssl_certificate /etc/letsencrypt/live/aglegal.com.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aglegal.com.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 16k;

    location ~ /\.(?!well-known/) {
        return 404;
    }

    location ~* \.(?:bak|sql|log|ini|config)$ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
    }
}
